  <header class="topbar" id="topbar" role="banner"></header>
  <div class="banners" id="banners" role="region" aria-label="Alerts"></div>

  <main id="main" tabindex="-1">
    <div id="view" class="view" aria-busy="true">
      <p class="boot">Loading Conductor&hellip;</p>
    </div>
  </main>

  <section class="expired" id="expired" role="alert" hidden>
    <div class="expired-card">
      <h1>Session expired</h1>
      <p>Conductor signs you in with a one-time link. Run this command in a terminal to open a fresh signed-in tab:</p>
      <p class="cmd-row"><code class="cmd" id="expired-cmd">conductor open</code><button type="button" class="btn btn-sm" id="expired-copy">Copy command</button></p>
      <p class="muted">Already did that? <button type="button" class="link-btn" id="expired-retry">Check again</button></p>
    </div>
  </section>

  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>
  <dialog id="dlg" class="dlg" aria-labelledby="dlg-title"></dialog>
  <dialog id="dlg-confirm" class="dlg dlg-confirm" aria-labelledby="dlg-confirm-title"></dialog>

  <div class="toast-stack">
    <div class="toasts" id="toasts" role="status" aria-live="polite" aria-relevant="additions"></div>
    <div class="toasts" id="toasts-alert" role="alert" aria-live="assertive"></div>
  </div>

  <noscript><p class="boot">Conductor needs JavaScript to run the dashboard.</p></noscript>
