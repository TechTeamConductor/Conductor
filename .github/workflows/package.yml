# Packages the CLI release (conductor.tgz + SHA256SUMS.txt + the two installers) and proves the installers work.
# Used by CI on every pull request and by the release workflow (which passes the real version). Run by hand for a dry run:
# Actions -> Package -> Run workflow (default version 0.0.0-ci). Nothing here publishes anything.
name: Package

on:
  workflow_call:
    inputs:
      version:
        description: Version to stamp (X.Y.Z or X.Y.Z-suffix)
        type: string
        required: false
        default: 0.0.0-ci
    outputs:
      windows-ok:
        description: "true when the Windows install check passed (experimental, never blocks)"
        value: ${{ jobs.smoke-win.outputs.passed }}
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp (dry run)
        type: string
        required: false
        default: 0.0.0-ci

permissions:
  contents: read

jobs:
  package:
    name: Pack and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the version
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]*[0-9A-Za-z])?$'; then echo "::error::invalid version"; exit 1; fi
      - name: Lint the installers
        run: |
          shellcheck -x install/install.sh
          pwsh -NoProfile -Command '$errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("install/install.ps1", [ref]$null, [ref]$errors); if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; throw "install.ps1 has syntax errors" }'
      - name: Stamp the version and pack
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          mkdir -p out release
          npm pack --pack-destination out --silent
          cp out/*.tgz release/conductor.tgz
          cp install/install.sh install/install.ps1 release/
          (cd release && sha256sum conductor.tgz install.sh install.ps1 > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Smoke test the package outside node_modules
        run: |
          d="$(mktemp -d)"
          tar -xzf release/conductor.tgz -C "$d" --strip-components=1
          test "$(node "$d/bin/conductor.mjs" version)" = "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conductor-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  smoke-unix:
    name: Install check (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conductor-release
          path: rel
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'
      - name: Install, start, update, tamper check, uninstall
        run: |
          set -euo pipefail
          rel="$PWD/rel"
          export HOME="$RUNNER_TEMP/smoke home"
          mkdir -p "$HOME"
          export CONDUCTOR_HOME="$HOME/data"
          export CONDUCTOR_LOCAL_DIR="$rel"
          bash "$rel/install.sh"
          export PATH="$HOME/.local/bin:$PATH"
          test "$(conductor version)" = "$VERSION"
          conductor start --no-open --port 4399 > "$RUNNER_TEMP/start.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          code=000
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4399/ || true)"
            case "$code" in 200|302|401) break ;; esac
            sleep 0.5
          done
          case "$code" in 200|302|401) ;; *) cat "$RUNNER_TEMP/start.log"; echo "dashboard did not answer ($code)"; exit 1 ;; esac
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          # update path: run the installer again
          bash "$rel/install.sh"
          test "$(conductor version)" = "$VERSION"
          # tamper check: a modified tarball must be refused
          cp -R "$rel" "$RUNNER_TEMP/tampered"
          printf 'x' >> "$RUNNER_TEMP/tampered/conductor.tgz"
          if CONDUCTOR_LOCAL_DIR="$RUNNER_TEMP/tampered" bash "$rel/install.sh"; then echo "a tampered tarball was accepted"; exit 1; fi
          test "$(conductor version)" = "$VERSION"
          # uninstall removes the app, never the data
          mkdir -p "$CONDUCTOR_HOME"
          echo keep > "$CONDUCTOR_HOME/sentinel"
          bash "$rel/install.sh" --uninstall
          test -f "$CONDUCTOR_HOME/sentinel"
          test ! -e "$HOME/.conductor-app"
          test ! -e "$HOME/.local/bin/conductor"

  smoke-win:
    name: Install check (Windows, experimental)
    needs: package
    runs-on: windows-2022
    timeout-minutes: 15
    continue-on-error: true # experimental: the result is reported through the "passed" output, it never fails the workflow
    outputs:
      passed: ${{ steps.state.outputs.passed }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conductor-release
          path: rel
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'
      - name: Install, start, update, tamper check, uninstall
        id: probe
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $PWD 'rel'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'lad'
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'profile'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA, $env:USERPROFILE | Out-Null
          $env:CONDUCTOR_HOME = Join-Path $env:USERPROFILE '.conductor-v2'
          $env:CONDUCTOR_LOCAL_DIR = $rel
          $env:CONDUCTOR_NO_PATH_UPDATE = '1'
          & (Join-Path $rel 'install.ps1')
          $shim = Join-Path $env:LOCALAPPDATA 'Conductor\bin\conductor.cmd'
          if ((& $shim version | Out-String).Trim() -ne $env:VERSION) { throw 'conductor version does not match' }
          $log = Join-Path $env:RUNNER_TEMP 'start.log'
          $p = Start-Process -FilePath node -ArgumentList @((Join-Path $env:LOCALAPPDATA 'Conductor\app\bin\conductor.mjs'), 'start', '--no-open', '--port', '4399') -PassThru -RedirectStandardOutput $log -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'start.err')
          try {
            $code = 0
            for ($i = 0; $i -lt 60; $i++) {
              # curl.exe (no -L: a 302 stays a 302). It prints 000 when nothing answers, so anything that is not three digits counts as 0.
              $out = (& curl.exe -s -o NUL --max-time 3 --noproxy '*' -w '%{http_code}' 'http://127.0.0.1:4399/' | Out-String).Trim()
              $curlExit = $LASTEXITCODE
              $code = if ($out -match '^[0-9]{3}$') { [int]$out } else { 0 }
              if ($code -in 200, 302, 401) { break }
              Start-Sleep -Milliseconds 500
            }
            if ($code -notin 200, 302, 401) { Get-Content $log, (Join-Path $env:RUNNER_TEMP 'start.err') -ErrorAction SilentlyContinue; throw "dashboard did not answer (last status $code, curl exit $curlExit)" }
          } finally {
            if ($p -and -not $p.HasExited) { & taskkill /T /F /PID $p.Id | Out-Null }
          }
          # update path, through the exact form users run: the script text piped into Invoke-Expression (the host must survive it)
          Get-Content -Raw -LiteralPath (Join-Path $rel 'install.ps1') | Invoke-Expression
          Write-Host 'host survived Invoke-Expression'
          if ((& $shim version | Out-String).Trim() -ne $env:VERSION) { throw 'conductor version does not match after the update' }
          # tamper check
          $tampered = Join-Path $env:RUNNER_TEMP 'tampered'
          Copy-Item -Recurse -Path $rel -Destination $tampered
          [System.IO.File]::AppendAllText((Join-Path $tampered 'conductor.tgz'), 'x')
          $env:CONDUCTOR_LOCAL_DIR = $tampered
          $refused = $false
          try { & (Join-Path $rel 'install.ps1') } catch { $refused = $true }
          if (-not $refused) { throw 'a tampered tarball was accepted' }
          $env:CONDUCTOR_LOCAL_DIR = $rel
          # uninstall removes the app, never the data
          New-Item -ItemType Directory -Force -Path $env:CONDUCTOR_HOME | Out-Null
          Set-Content -Path (Join-Path $env:CONDUCTOR_HOME 'sentinel') -Value 'keep'
          $env:CONDUCTOR_UNINSTALL = '1'
          & (Join-Path $rel 'install.ps1')
          if (-not (Test-Path (Join-Path $env:CONDUCTOR_HOME 'sentinel'))) { throw 'uninstall removed the data folder' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Conductor\app')) { throw 'uninstall left the app behind' }
      - name: Record the result
        id: state
        if: always()
        shell: pwsh
        env:
          PROBE: ${{ steps.probe.outcome }}
        run: |
          if ($env:PROBE -eq 'success') { 'passed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { 'passed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
